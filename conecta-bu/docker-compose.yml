# Servicios de apoyo para desarrollo local. Uso: docker compose up -d
#
# - postgres: base de datos. En backend/.env:
#     DATABASE_URL="postgresql://postgres:postgres@localhost:5432/conecta_bu?schema=public"
# - n8n (Sprint 5, RF-013 / RF-014): automatizaciones y agente IA en http://localhost:5678
#     Las claves se leen de un archivo .env junto a este docker-compose.yml (ver n8n/README.md):
#     CONECTA_BU_SECRET, GEMINI_API_KEY, GEMINI_MODEL, CONECTA_BU_REMITENTE,
#     SMTP_USUARIO y SMTP_CLAVE.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conecta_bu
    ports:
      - "5432:5432"
    volumes:
      - conecta_bu_pgdata:/var/lib/postgresql/data

  n8n:
    # Version probada con los flujos de Conecta BU (n8n 2.x). Para actualizar,
    # cambia el numero y vuelve a probar con n8n/probar-n8n.ps1.
    image: docker.n8n.io/n8nio/n8n:2.42.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      # Los flujos de Conecta BU leen sus claves con $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CONECTA_BU_SECRET: ${CONECTA_BU_SECRET:-}
      CONECTA_BU_REMITENTE: ${CONECTA_BU_REMITENTE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # Correo para las notificaciones (opcional). Con Gmail: tu correo y una
      # contrasena de aplicacion (https://myaccount.google.com/apppasswords).
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PUERTO: ${SMTP_PUERTO:-465}
    # Importa y publica los flujos y crea la credencial de correo al encender
    # (ver n8n/iniciar.sh): no hay que hacerlo a mano.
    entrypoint: ["/bin/sh", "/home/node/flujos/iniciar.sh"]
    volumes:
      - conecta_bu_n8n:/home/node/.n8n
      - ./n8n:/home/node/flujos:ro

volumes:
  conecta_bu_pgdata:
  conecta_bu_n8n:
